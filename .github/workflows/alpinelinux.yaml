name: Alpine Linux

on:
  pull_request:
  workflow_dispatch:  # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: alpine:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

    - name: Install build dependencies
      run: |
        apk update
        apk add --no-cache   \
          bash               \
          boost-dev          \
          bsd-compat-headers \
          cmake              \
          crypto++-dev       \
          flock              \
          gcc                \
          g++                \
          fmt-dev            \
          gnutls-dev         \
          hwloc-dev          \
          libpciaccess-dev   \
          libucontext-dev    \
          libunwind-dev      \
          liburing-dev       \
          lksctp-tools-dev   \
          lz4-dev            \
          make               \
          meson              \
          numactl-dev        \
          openssl            \
          openssl-dev        \
          protobuf-dev       \
          py3-yaml           \
          ragel              \
          samurai            \
          stow               \
          util-linux-dev     \
          valgrind-dev       \
          xfsprogs-dev       \
          yaml-cpp-dev

    - name: Configure build
      run: |
        # cooking.sh resolves -d with realpath before creating it, and busybox
        # realpath fails on a path that does not exist yet.
        mkdir -p build
        ./cooking.sh -i c-ares -d build -t RelWithDebInfo -- \
         -DSeastar_LTTNG=OFF               \
         -DSeastar_DOCS=OFF

    - name: Build Seastar
      run: |
        cmake --build build

    - name: Run unit tests
      run: |
        ctest --test-dir build --output-on-failure
