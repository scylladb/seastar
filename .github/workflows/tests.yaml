name: Test

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:  # Allows manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  regular_test:
    name: "${{ format('Test ({0}{1}, C++{2}, {3}, {4}, {5})', matrix.info, matrix.compiler, matrix.standard, matrix.mode, matrix.arch, matrix['reactor-backend']) }}"
    uses: ./.github/workflows/test.yaml
    strategy:
      fail-fast: false
      matrix:
        # This include block is AUTOGENERATED, do not edit by hand
        # instead edit + re-run .github/workflows/gen-matrix.py
        include:
          - {compiler: clang++-21, standard: 23, mode: debug, arch: x86, reactor-backend: io_uring}
          - {compiler: clang++-22, standard: 26, mode: release, arch: x86, reactor-backend: linux-aio}
          - {compiler: g++-15, standard: 26, mode: release, arch: arm, reactor-backend: epoll}
          - {compiler: g++-16, standard: 23, mode: release, arch: x86, reactor-backend: epoll}
          - {compiler: g++-16, standard: 23, mode: release, arch: arm, reactor-backend: linux-aio}
          - {compiler: g++-15, standard: 26, mode: release, arch: x86, reactor-backend: io_uring}
          - {compiler: clang++-22, standard: 23, mode: sanitize, arch: arm, reactor-backend: io_uring}
          - {compiler: clang++-21, standard: 26, mode: sanitize, arch: x86, reactor-backend: linux-aio}
          - {compiler: clang++-21, standard: 26, mode: debug, arch: arm, reactor-backend: epoll}
          - {compiler: clang++-22, standard: 26, mode: sanitize, arch: x86, reactor-backend: epoll}
          - {compiler: g++-15, standard: 23, mode: release, arch: x86, reactor-backend: linux-aio}
          - {compiler: g++-16, standard: 26, mode: release, arch: x86, reactor-backend: linux-aio}
          - {compiler: clang++-22, standard: 23, arch: x86, mode: dev, reactor-backend: linux-aio, options: --heap-profiling, info: 'heapprof, '}
          - {compiler: clang++-22, standard: 23, arch: x86, mode: release, reactor-backend: linux-aio, enables: --enable-dpdk, options: --cook dpdk --dpdk-machine corei7-avx, info: 'dpdk, '}
          - {compiler: clang++-22, standard: 23, arch: x86, mode: debug, reactor-backend: linux-aio, enables: --enable-cxx-modules, enable-ccache: false, info: 'modules, '}
          - {compiler: clang++-22, standard: 23, arch: x86, mode: fuzz, reactor-backend: linux-aio, test-args: -- -R 'Seastar.fuzz.'}
    with:
      compiler: ${{ matrix.compiler }}
      standard: ${{ matrix.standard }}
      mode: ${{ matrix.mode }}
      arch: ${{ matrix.arch }}
      enables: ${{ matrix.enables }}
      options: ${{ matrix.options }}
      enable-ccache: ${{ !contains(matrix['enable-ccache'], 'false') }}
      test-args: ${{ matrix['test-args'] }}
      reactor-backend: ${{ matrix['reactor-backend'] }}
