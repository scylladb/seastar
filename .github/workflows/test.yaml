name: Test

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      compiler:
        description: 'the C++ compiler to use'
        type: string
        required: true
      standard:
        description: 'the C++ standard to use'
        type: number
        required: true
      mode:
        description: 'build mode (debug, dev or release)'
        type: string
        required: true
      arch:
        description: "runner architecture: x86 or arm"
        type: string
        default: x86
        required: false
      enables:
        description: 'the --enable-* option passed to configure.py'
        type: string
        default: ''
        required: false
      enable-ccache:
        description: 'build with ccache enabled'
        type: boolean
        default: true
        required: false
      options:
        description: 'additional options passed to configure.py'
        type: string
        default: ''
        required: false
      test-args:
        description: 'additional arguments passed to test.py'
        type: string
        default: ''
        required: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ${{ inputs.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ubuntu:26.04
    steps:
      - name: Show parameters
        run: |
          echo "compiler=${{ inputs.compiler }} standard=${{ inputs.standard }} mode=${{ inputs.mode }} enable-ccache=${{ inputs.enable-ccache }}"
          echo "enables=${{ inputs.enables }}"
          echo "options=${{ inputs.options }}"
          echo "test-args=${{ inputs.test-args }}"

      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          submodules: "${{ contains(inputs.enables, 'dpdk') }}"

      - name: Setup ccache
        if: ${{ inputs.enable-ccache }}
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: ${{ inputs.compiler }}-${{ inputs.standard }}-${{ inputs.mode }}-${{ inputs.enables }}

      - name: Install build environment
        env:
          COMPILER: ${{ inputs.compiler }}
          ENABLES: ${{ inputs.enables }}
          STANDARD: ${{ inputs.standard }}
          MODE: ${{ inputs.mode }}
          OPTIONS: ${{ inputs.options }}
          ENABLE_CCACHE: ${{ inputs.enable-ccache }}
        run: .github/workflows/install-build-env.sh

      - name: Build
        run: cmake --build build/${{inputs.mode}}

      - name: Check Header
        if: ${{ inputs.mode == 'dev' && startsWith(inputs.compiler, 'clang++') }}
        run: cmake --build build/${{ inputs.mode }} --target checkheaders

      - name: Check Include Style
        if: ${{ inputs.mode == 'dev' && startsWith(inputs.compiler, 'clang++') }}
        run: cmake --build build/${{ inputs.mode }} --target check-include-style

      - name: Build with C++20 modules
        if: ${{ contains(inputs.enables, 'cxx-modules') }}
        run: cmake --build build/${{ inputs.mode }} --target hello_cxx_module

      # Seastar_IMPORT_FMT publishes its definitions and flags to installed
      # consumers only -- deliberately, so that Seastar's own targets keep
      # including fmt textually -- so nothing in the build tree above compiles
      # the way an application does. Install it and build one, over each
      # channel. See tests/consumer/CMakeLists.txt.
      - name: Build installed consumers
        if: ${{ contains(inputs.enables, 'import-fmt') }}
        run: |
          # No --prefix here: the paths inside seastar.pc and the installed
          # CMake package are fixed at configure time, so install where
          # configure.py said (/usr/local) or they point somewhere else.
          cmake --install build/${{ inputs.mode }}
          # Seastar's CMake package re-finds fmt on the consumer's behalf, and
          # the fmt module comes from there, but a cooked fmt is installed
          # under the build directory rather than system-wide.
          PKG_CONFIG_PATH="$(dirname "$(find /usr/local -name seastar.pc)")" \
            cmake -G Ninja -S tests/consumer -B build/consumer \
              -DCMAKE_CXX_COMPILER=${{ inputs.compiler }} \
              -DCMAKE_CXX_STANDARD=${{ inputs.standard }} \
              -DCMAKE_PREFIX_PATH="$PWD/build/${{ inputs.mode }}/_cooking/installed"
          cmake --build build/consumer

      # The import-fmt job builds no tests: the library it produces is the same
      # one the regular jobs build, since Seastar_IMPORT_FMT only changes what
      # a consumer's translation units do. See gen-matrix.py.
      - name: Test
        if: ${{ ! contains(inputs.enables, 'cxx-modules') && ! contains(inputs.enables, 'import-fmt') }}
        run: ./test.py --mode=${{ inputs.mode }} ${{ inputs.test-args }}
